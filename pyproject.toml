[tool.poetry]
name = "gcp-mentoring-backend"
version = "0.1.0"
description = "AI Personal Trainer Multi-Agent System: Generate hyper-personalized workout plans via autonomous multi-agent refinement loop"
authors = ["Massa <massa@example.com>"]
readme = "README.md"
packages = [
    { include = "agents" },
    { include = "models.py" },
    { include = "main.py" },
]

[tool.poetry.dependencies]
python = "^3.10"
google-genai = "^0.3.0"
python-dotenv = "^1.0.0"
fastapi = "^0.104.0"
uvicorn = {version = "^0.24.0", extras = ["standard"]}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.1.0"
black = "^23.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]
